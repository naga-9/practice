<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Practice{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/unpoly@3.14.3/unpoly.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/unpoly@3.14.3/unpoly-bootstrap5.min.css" rel="stylesheet">
    <style>
        /* Loading state: Unpoly adds .up-loading to the fragment being replaced */
        .up-loading { opacity: 0.5; transition: opacity 0.2s; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}" up-follow up-target="main">Practice</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}" up-follow up-target="main">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about' %}" up-follow up-target="main">About</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/unpoly@3.14.3/unpoly.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/unpoly@3.14.3/unpoly-bootstrap5.min.js"></script>
</body>
</html>
